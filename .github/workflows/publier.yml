# Publie le site (build.py puis publish.sh) à chaque push sur main qui touche le site.
# Les posts et vidéos (social/) et la passation ne déclenchent rien.
name: Publier le site
on:
  push:
    branches: [main]
    paths-ignore: ['social/**', 'PASSATION.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publier
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      # Versions figées par empreinte (v4 et v5) : une étiquette déplacée ne peut pas changer ce qui s'exécute.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Le message du commit passe par une variable : jamais interprété comme une commande.
      - env:
          MSG: ${{ github.event.head_commit.message || 'Publication manuelle' }}
        run: ./publish.sh "$MSG"
