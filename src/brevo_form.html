<div class="sib-form sg-form">
<style>
.sg-form{margin:0;padding:0}
.sg-form .sib-form-message-panel{display:none;font-size:15px;line-height:1.45;border-radius:8px;padding:12px 14px;margin:0 0 10px;border:1.5px solid}

<div id="success-message" class="sib-form-message-panel"><div class="sib-form-message-panel__text"><svg viewBox="0 0 512 512" class="sib-icon sib-notification__icon"><path d="M256 8a248 248 0 100 496 248 248 0 000-496zm142 190L217 376c-5 5-12 5-17 0l-86-87c-5-4-5-12 0-17l9-8c4-5 12-5 17 0l69 70 163-162c5-5 13-5 17 0l9 8c4 5 4 13-1 18z"/></svg><span class="sib-form-message-panel__inner-text">Merci ! C'est noté : vous recevez le Kit anti-arnaques 2026 par email dans quelques instants, puis le Radar chaque dimanche.</span></div></div>
<div id="sib-container" class="sib-container--large sib-container--vertical">
<form id="sib-form" method="POST" action="https://962d435b.sibforms.com/serve/MUIFANcggFG-Toxcwrulv87nZ6NM5kg7gbaoer8v1BHz0B0KM_dsq3Vwr6Uu8Q1l7wOLiartPsriOlYkNulSsVaoWn3sg5qrDPaBjMYf6pi5pkiIHIf9mSqjzue-uVixwde64JRJLXh_dVSL-f6gvQPGhXITFlxt31x-RDJSf2erAnQ4dEFXJt3QY7zWYqL1uqdJ0GwdHdGwedWMAA==" data-type="subscription">
<div class="sib-input sib-form-block" style="display:contents">
<div class="form__entry entry_block" style="display:contents">
<label class="entry__label" for="EMAIL" data-required="*" hidden>Adresse email</label>
<div class="entry__field"><input class="input" type="email" id="EMAIL" name="EMAIL" autocomplete="email" value="" placeholder="votre@email.fr" data-required="true" required></div>

</div>
<button class="btn sib-form-block__button sib-form-block__button-with-loader" form="sib-form" type="submit"><svg class="icon clickable__icon progress-indicator__icon sib-hide-loader-icon" viewBox="0 0 512 512"><path d="M460 374l-21-12c-5-3-7-10-4-16 30-60 28-132-6-190-33-58-95-96-162-100-6 0-11-5-11-12V20c0-7 6-12 13-12 83 5 160 51 202 124 42 73 44 162 6 237-3 6-11 8-17 5z"/></svg>Recevoir le Radar</button>

</div>
<script>
window.REQUIRED_CODE_ERROR_MESSAGE='Veuillez choisir un code pays';window.LOCALE='fr';
window.EMAIL_INVALID_MESSAGE=window.SMS_INVALID_MESSAGE="Cette adresse email ne semble pas valide. Vérifiez-la et réessayez.";
window.REQUIRED_ERROR_MESSAGE="Indiquez votre adresse email.";
window.GENERIC_INVALID_MESSAGE="Les informations fournies ne sont pas valides. Vérifiez le champ et réessayez.";
window.INVALID_NUMBER=window.GENERIC_INVALID_MESSAGE;window.INVALID_DATE="Veuillez saisir une date valide";
window.REQUIRED_MULTISELECT_MESSAGE='Veuillez choisir au moins une option';
window.translation={common:{selectedList:'{quantity} liste sélectionnée',selectedLists:'{quantity} listes sélectionnées',selectedOption:'{quantity} sélectionné',selectedOptions:'{quantity} sélectionnés'}};
var AUTOHIDE=Boolean(0);
</script>
<script>
/* Envoi géré par SecureGuide : on poste l'inscription à Brevo en arrière-plan, puis on confirme toujours à l'écran
   (redirection vers la page de remerciement si le formulaire a data-redirect, sinon message de succès). */
(function(){
  var f=document.getElementById("sib-form"); if(!f) return;
  var box=f.closest(".sg-form"), ok=box.querySelector("#success-message"), ko=box.querySelector("#error-message"), btn=f.querySelector("button[type=submit]");
  f.addEventListener("submit",function(e){
    e.preventDefault(); e.stopImmediatePropagation();
    if(f.querySelector("[name=email_address_check]").value) return;
    var label=btn.innerHTML; btn.disabled=true; btn.textContent="Envoi…";
    var done=function(){
      var to=f.getAttribute("data-redirect");
      if(to){ location.href=to; return; }
      f.style.display="none"; ok.style.display="block"; ko.style.display="none";
    };
    fetch(f.action,{method:"POST",mode:"no-cors",body:new URLSearchParams(new FormData(f))}).then(done).catch(function(){
      btn.disabled=false; btn.innerHTML=label; ko.style.display="block";
    });
  },true);
})();
</script>
